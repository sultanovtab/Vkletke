<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бронирование квестов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://raw.githubusercontent.com/sultanovtab/Vkletke/refs/heads/main/photo_2026-08-23_15-34-07.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-sizing: border-box;
            padding: 16px;
        }

        .container { max-width: 400px; margin: auto; }

        .card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 { font-size: 20px; margin-top: 0; text-align: center; color: #fff; }
        label { font-size: 14px; color: #ddd; display: block; margin-top: 10px; margin-bottom: 4px; }
        
        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(10, 10, 10, 0.9);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        input[type="date"], input[type="number"] {
            width: auto;
            max-width: 170px;
            display: block;
        }

        select option { background: #111; color: #fff; }

        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        
        .time-slot {
            background: rgba(40, 40, 40, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 0; text-align: center; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s;
        }
        .time-slot.selected { background: #e74c3c; border-color: #ff6b6b; color: #fff; }
        .time-slot.disabled { background: rgba(20, 20, 20, 0.5); color: #666; border-color: rgba(255, 255, 255, 0.05); text-decoration: line-through; cursor: not-allowed; }

        button.main-btn {
            background-color: #e74c3c; color: #ffffff; border: none; padding: 14px; width: 100%;
            font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .admin-panel { display: none; background: rgba(20, 20, 20, 0.95); border: 2px dashed #e74c3c; padding: 15px; margin-top: 20px; border-radius: 16px; }
        .tab-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .tab-bar button { background: rgba(50, 50, 50, 0.8); width: 48%; padding: 10px; font-size: 14px; margin-top: 0; border: none; color: white; border-radius: 8px; cursor: pointer; }

        .booking-item { 
            background: rgba(10, 10, 10, 0.9); 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border-left: 4px solid #f39c12; 
            position: relative;
        }
        .booking-item.approved { border-left-color: #2ecc71; }
        .booking-item.rejected { border-left-color: #e74c3c; }
        
        /* Стили для конфликтующих заявок */
        .booking-item.conflict {
            border: 2px solid #e74c3c;
            background: rgba(40, 10, 10, 0.9);
            border-left: 4px solid #e74c3c;
        }
        .conflict-badge {
            background-color: #e74c3c;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .admin-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-approve { background: #2ecc71; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* Стили для кликабельной ссылки Telegram */
        .tg-link {
            color: #3498db;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-bar">
        <button onclick="switchTab('client')">📅 Бронировать</button>
        <button onclick="checkAdmin()" style="background-color: rgba(80, 80, 80, 0.8);">🛠 Админка</button>
    </div>

    <!-- КЛИЕНТСКАЯ ЧАСТЬ -->
    <div id="clientView">
        <div class="card" id="mainForm">
            <h2>Квест «В Клетке»</h2>
            
            <label>Выбери режим квеста:</label>
            <select id="questSelect">
                <option value="славянская оргия">славянская оргия</option>
                <option value="восточный хардкор">восточный хардкор</option>
            </select>

            <label>Дата:</label>
            <input type="date" id="bookDate" onchange="loadAvailableSlots()">

            <label>Свободные сеансы:</label>
            <div class="time-grid" id="timeGrid"></div>

            <label>Количество человек:</label>
            <input type="number" id="peopleCount" min="2" max="10" value="4">

            <label>Ваше имя:</label>
            <input type="text" id="userName" placeholder="имя магомеда" maxlength="40">

            <label>Российский телефон:</label>
            <input type="tel" id="userPhone" value="+7 ">

            <button class="main-btn" id="submitBtn" onclick="submitBooking()">проверить дырочки</button>
        </div>
    </div>

    <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
    <div id="adminView" class="admin-panel">
        <h2>Панель администратора</h2>
        <div id="adminBookingsList" style="font-size: 14px; max-height: 500px; overflow-y: auto;">Загрузка броней...</div>
        <button class="main-btn" onclick="switchTab('client')" style="background-color: #555;">Выйти</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygoXVdarlwZaf7bXb4jZPmZmSAUNVRXLHL6s1lNJeG3mzkGJLNJMNFF9Raw5iXwJ4I/exec";
    const ALL_SLOTS = ["12:00", "13:30", "15:00", "16:30", "18:00", "19:30", "21:00"];
    
    let selectedTimeSlot = "";
    let allBookingsCache = [];
    let currentAdminPassword = "";
    
    let tgUser = tg.initDataUnsafe?.user;
    let tgId = tgUser?.id || "";
    let tgUsername = tgUser?.username ? "@" + tgUser.username : "";

    if (tgUser) document.getElementById('userName').value = tgUser.first_name || '';
    document.getElementById('bookDate').valueAsDate = new Date();
    loadAvailableSlots();

    const phoneInput = document.getElementById('userPhone');
    phoneInput.addEventListener('input', function(e) {
        let input = this.value;
        let numbers = input.replace(/\D/g, '');
        if (numbers.length === 0) numbers = '7';
        if (numbers.length === 1 && numbers[0] === '8') numbers = '7';
        else if (numbers[0] !== '7') numbers = '7' + numbers;
        numbers = numbers.substring(0, 11);
        let formatted = '+7 ';
        if (numbers.length > 1) formatted += '(' + numbers.substring(1, 4);
        if (numbers.length > 4) formatted += ') ' + numbers.substring(4, 7);
        if (numbers.length > 7) formatted += '-' + numbers.substring(7, 9);
        if (numbers.length > 9) formatted += '-' + numbers.substring(9, 11);
        this.value = formatted;
    });

    phoneInput.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && this.value.length <= 3) e.preventDefault();
    });

    function switchTab(role) {
        if (role === 'client') {
            document.getElementById('clientView').style.display = 'block';
            document.getElementById('adminView').style.display = 'none';
        } else {
            document.getElementById('clientView').style.display = 'none';
            document.getElementById('adminView').style.display = 'block';
            loadAdminData();
        }
    }

    async function checkAdmin() {
        let password = prompt("Введите пароль администратора:");
        if (!password) return;
        try {
            let res = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "verifyAdmin", password: password })
            });
            let data = await res.json();
            if (data.status === "success") {
                currentAdminPassword = password;
                switchTab('admin');
            } else alert("Неверный пароль!");
        } catch(e) { alert("Ошибка проверки пароля"); }
    }

    async function fetchBookings() {
        try {
            let response = await fetch(GOOGLE_SCRIPT_URL);
            allBookingsCache = await response.json();
        } catch (e) { console.error("Ошибка загрузки", e); }
    }

    async function loadAvailableSlots() {
        let grid = document.getElementById('timeGrid');
        grid.innerHTML = "<div style='grid-column: span 3; text-align: center; color: #888;'>Проверка слотов...</div>";
        await fetchBookings();
        let currentDate = document.getElementById('bookDate').value;
        grid.innerHTML = "";

        let occupiedTimes = allBookingsCache
            .filter(b => b.date === currentDate && b.status === "Подтверждено")
            .map(b => b.time);

        ALL_SLOTS.forEach(slot => {
            let div = document.createElement('div');
            div.className = 'time-slot';
            div.innerText = slot;

            if (occupiedTimes.includes(slot)) {
                div.classList.add('disabled');
            } else {
                if (slot === selectedTimeSlot) div.classList.add('selected');
                div.onclick = function() {
                    document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedTimeSlot = slot;
                };
            }
            grid.appendChild(div);
        });
    }

    async function submitBooking() {
        let date = document.getElementById('bookDate').value;
        let name = document.getElementById('userName').value.trim();
        let phone = document.getElementById('userPhone').value.trim();
        let digitsOnly = phone.replace(/\D/g, '');

        if (!selectedTimeSlot) return alert("Выберите время сеанса!");
        if (!date || !name) return alert("Заполните имя!");
        if (digitsOnly.length !== 11) return alert("Введите полный номер (10 цифр после +7).");

        let btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Бронируем...";

        let bookingData = { 
            quest: document.getElementById('questSelect').value, 
            date: date, 
            time: selectedTimeSlot, 
            name: name, 
            phone: phone,
            people: document.getElementById('peopleCount').value,
            tgUsername: tgUsername,
            tgId: tgId
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bookingData)
            });

            alert(`Успех! Твоя заявка отправлена. Ожидай подтверждения.`);
            document.getElementById('userPhone').value = '+7 ';
            selectedTimeSlot = "";
            loadAvailableSlots();
        } catch (error) {
            alert("Ошибка при отправке.");
        } finally {
            btn.disabled = false;
            btn.innerText = "проверить дырочки";
        }
    }

    async function loadAdminData() {
        let listDiv = document.getElementById('adminBookingsList');
        listDiv.innerHTML = "Загрузка заявок...";
        await fetchBookings();
        
        if (!allBookingsCache || allBookingsCache.length === 0) {
            listDiv.innerHTML = "Заявок нет.";
            return;
        }

        // Поиск конфликтов по дате и времени среди ожидающих заявок
        let pendingBookings = allBookingsCache.filter(b => b.status === "Ожидает");
        let conflicts = {};
        
        pendingBookings.forEach(b => {
            let key = `${b.date}_${b.time}`;
            if (!conflicts[key]) {
                conflicts[key] = 0;
            }
            conflicts[key]++;
        });

        let html = "";
        allBookingsCache.reverse().forEach((b) => {
            let statusClass = b.status === "Подтверждено" ? "approved" : (b.status === "Отклонено" ? "rejected" : "");
            
            // Проверка на конфликт (если на это же время претендует >1 заявки)
            let isConflict = false;
            if (b.status === "Ожидает" && conflicts[`${b.date}_${b.time}`] > 1) {
                isConflict = true;
                statusClass += " conflict";
            }

            // Обработка кликабельной ссылки на Telegram
            let tgHtml = 'Нет данных';
            if (b.tgUser) {
                 // Если это настоящая ссылка на профиль
                if (b.tgUser.includes('t.me')) {
                     // Вытаскиваем юзернейм из гиперссылки (вида =HYPERLINK("https://t.me/...", "@..."))
                     let match = b.tgUser.match(/t\.me\/([^"]+)/);
                     let username = match ? match[1] : null;
                     if (username) {
                          tgHtml = `<a href="https://t.me/${username}" target="_blank" class="tg-link">Перейти в TG (@${username})</a>`;
                     } else {
                         // Fallback если вдруг структура другая
                         tgHtml = `<a href="${b.tgUser}" target="_blank" class="tg-link">Перейти в TG</a>`;
                     }
                } else if (b.tgUser.includes('ID:')) {
                    // Если это просто ID
                    tgHtml = `<span style="color: #bbb;">${b.tgUser} (без @username)</span>`;
                }
            }

            html += `
                <div class="booking-item ${statusClass}">
                    ${isConflict ? '<div class="conflict-badge">⚠️ Совпадение по времени</div>' : ''}
                    <b>${b.quest}</b> [${b.status}]<br>
                    📅 <b>${b.date} в ${b.time}</b><br>
                    👥 Игроков: ${b.people} чел.<br>
                    👤 ${b.name} (${b.phone})<br>
                    🔗 ${tgHtml}<br>
                    ${b.status === "Ожидает" ? `
                        <div class="admin-actions">
                            <button class="btn-approve" onclick="updateStatus('${b.id}', 'Подтверждено')">✅ Принять</button>
                            <button class="btn-reject" onclick="updateStatus('${b.id}', 'Отклонено')">❌ Отклонить</button>
                        </div>
                    ` : ''}
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    async function updateStatus(bookingId, newStatus) {
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "updateStatus", bookingId: bookingId, newStatus: newStatus, password: currentAdminPassword })
            });
            alert(`Статус изменен на: ${newStatus}`);
            // После изменения статуса, нужно обновить список заявок
            // и пересчитать конфликты
            loadAdminData(); 
        } catch (e) { alert("Ошибка обновления статуса"); }
    }
</script>
</body>
</html>
