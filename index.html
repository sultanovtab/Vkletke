<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование квестов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #4caf50;
        }

        .toast.error {
            background: #f44336;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .bookings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .bookings-table th,
        .bookings-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        .bookings-table th {
            background: #f5f5f5;
            font-weight: bold;
        }

        .status-select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 12px;
        }

        .status-select.awaiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-select.confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-select.cancelled {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('booking')">Бронирование</button>
            <button class="tab" onclick="switchTab('admin')">Админ-панель</button>
        </div>

        <!-- Вкладка бронирования -->
        <div id="booking-tab" class="tab-content active">
            <h1>🎮 Бронирование квеста</h1>
            <form id="booking-form">
                <div class="form-group">
                    <label for="quest">Выберите квест:</label>
                    <select id="quest" required>
                        <option value="">Выберите квест...</option>
                        <option value="В Клетке">В Клетке</option>
                        <option value="Побег из тюрьмы">Побег из тюрьмы</option>
                        <option value="Зомби апокалипсис">Зомби апокалипсис</option>
                        <option value="Тайна старого особняка">Тайна старого особняка</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Дата:</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Время:</label>
                    <input type="time" id="time" required>
                </div>

                <div class="form-group">
                    <label for="name">Ваше имя:</label>
                    <input type="text" id="name" required placeholder="Иван Иванов">
                </div>

                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" required placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label for="people">Количество человек:</label>
                    <input type="number" id="people" min="1" max="10" required placeholder="2">
                </div>

                <div class="form-group">
                    <label for="tg-username">Telegram username (опционально):</label>
                    <input type="text" id="tg-username" placeholder="@username">
                </div>

                <button type="submit">📝 Забронировать</button>
            </form>
        </div>

        <!-- Вкладка админа -->
        <div id="admin-tab" class="tab-content">
            <h1>🔐 Админ-панель</h1>
            <div id="admin-login" style="display: none;">
                <button onclick="checkAdmin()">Войти как администратор</button>
            </div>
            <div id="admin-content" style="display: none;">
                <h2>Список броней</h2>
                <table class="bookings-table" id="bookings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Квест</th>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Имя</th>
                            <th>Телефон</th>
                            <th>Чел.</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
