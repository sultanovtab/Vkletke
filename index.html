<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый TMA</title>
    <!-- Подключаем официальную библиотеку Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #counter {
            font-size: 48px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #2481cc);
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1 id="greeting">Привет!</h1>
    <div id="counter">0</div>
    <button id="clickBtn">Нажми на меня!</button>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран

        // Персонализация: выводим имя пользователя, если оно есть
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('greeting').innerText = Привет, ${tg.initDataUnsafe.user.first_name}!;
        }

        // Логика кликера
        let count = 0;
        const btn = document.getElementById('clickBtn');
        const counterText = document.getElementById('counter');

        btn.addEventListener('click', () => {
            count++;
            counterText.innerText = count;
            
            // Легкая вибрация при клике (если поддерживается смартфоном)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
